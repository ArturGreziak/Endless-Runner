<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Dziki Galop</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#142b29;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center;min-height:100dvh}#game{width:min(1024px,100vw,calc(100dvh * 1024 / 733));aspect-ratio:1024/733;position:relative;overflow:hidden;border-radius:12px;box-shadow:0 20px 80px #0007;touch-action:none}canvas{width:100%;height:100%;display:block}button{font:inherit;cursor:pointer;border:0;color:inherit}.hud{position:absolute;top:4%;left:4%;right:4%;display:flex;justify-content:space-between;align-items:start;pointer-events:none}.brand{letter-spacing:3px;font-size:clamp(10px,2vw,20px);font-weight:900}.tag{font-size:11px;letter-spacing:2px;color:#d9ecd6;margin-top:6px}.stats{display:flex;gap:10px;align-items:center}.pill{background:#163d36d9;border:1px solid #ffffff29;padding:10px 17px;border-radius:14px;font-weight:800;font-variant-numeric:tabular-nums}.stats button{pointer-events:auto;background:#163d36e8;padding:10px 16px;border-radius:12px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#102f2430;backdrop-filter:blur(3px)}.card{max-width:570px;width:85%;text-align:center;padding:36px;border:1px solid #fff4;border-radius:25px;background:#16382feb;box-shadow:0 20px 60px #0004}.eyebrow{font-size:12px;letter-spacing:4px;color:#f7cb7a}.card h1{font:900 clamp(28px,5vw,58px)/1.05 system-ui;margin:14px 0;color:#fff2cb}.card p{line-height:1.6;color:#d1e2d6;font-size:clamp(12px,1.7vw,17px)}.primary{background:#f6bf64;color:#263b2c;padding:15px 36px;border-radius:12px;font-weight:900;margin-top:12px}.help{position:absolute;bottom:23px;width:100%;text-align:center;font-size:12px;color:#fffbd7bb;letter-spacing:1px;pointer-events:none}.controls{position:absolute;bottom:6%;right:4%;display:flex;gap:10px}.controls button{background:#163d36ce;border:1px solid #ffffff60;border-radius:18px;padding:15px 23px;font-weight:800;user-select:none}.hidden{display:none!important}@media(max-width:600px){.tag,.help{display:none}.pill{padding:6px 9px;font-size:11px}.stats{gap:4px}.stats button{padding:6px 9px}.controls button{padding:10px 14px;font-size:12px}.card{padding:20px}.primary{padding:12px 25px}.eyebrow{font-size:9px}}
</style></head><body><main id="game" aria-label="Dziki Galop — gra zręcznościowa"><canvas id="view" width="1024" height="733" aria-label="Trasa jeźdźca"></canvas><div class="hud"><div><div class="brand">DZIKI GALOP<span style="color:#f6c473">.</span></div><div class="tag">BEZKRESNA PRZYGODA</div></div><div class="stats"><div class="pill"><span id="distance">0</span> m</div><div class="pill" style="color:#ffd27b">● <span id="coins">0</span></div><button id="pause" aria-label="Pauza">Ⅱ</button><button id="reset" aria-label="Rozpocznij od początku">↻</button></div></div><div id="overlay" class="overlay"><div class="card"><div class="eyebrow" id="eyebrow">W SIODŁO. PRZED SIEBIE.</div><h1 id="title">Dziki<br>Galop</h1><p id="message">Pędź przez słoneczną dolinę. Przeskakuj kłody i skały, schylaj się pod gałęziami i zbieraj złote monety.<br><b>Spacja / ↑</b> — skok · <b>↓</b> — schylenie · <b>P</b> — pauza</p><button id="start" class="primary">Ruszaj w drogę →</button><p id="record" style="font-size:12px;margin-bottom:0"></p></div></div><div class="help">SPACJA / ↑ SKOK &nbsp; · &nbsp; ↓ SCHYLENIE &nbsp; · &nbsp; P PAUZA &nbsp; · &nbsp; R OD NOWA</div><div class="controls hidden" id="controls"><button id="duck">↓ Schyl się</button><button id="jump">↑ Skok</button></div></main>
<script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const CFG={gravity:1700,jumpSpeed:-690,baseSpeed:315,maxSpeed:585,ground:573};
let state='ready',distance=0,coins=0,time=0,world=0,speed=315,y=0,vy=0,duck=false,duckTimer=0,spawn=1.9,objects=[],particles=[],last=0,best=0;
try{best=Number(localStorage.getItem('dzikiGalopBest'))||0}catch(e){}
$('record').textContent='Rekord: '+best+' m';
function panel(title,message,label){$('title').innerHTML=title;$('message').innerHTML=message;$('start').textContent=label;$('overlay').classList.remove('hidden');$('controls').classList.add('hidden')}
function start(){state='running';distance=coins=time=world=y=vy=duckTimer=0;duck=false;speed=CFG.baseSpeed;spawn=1.9;objects=[];particles=[];$('overlay').classList.add('hidden');$('controls').classList.remove('hidden');$('pause').textContent='Ⅱ';hud()}
function hud(){$('distance').textContent=Math.floor(distance);$('coins').textContent=coins}
function jump(){if(state==='running'&&y===0){vy=CFG.jumpSpeed;duck=false;duckTimer=0}}
function crouch(){if(state==='running'&&y===0){duck=true;duckTimer=.85}}
function pause(){if(state==='running'){state='paused';panel('Chwila oddechu','Twój koń odpoczywa. Wróć na trasę, kiedy będziesz gotowy.','Kontynuuj →');$('pause').textContent='▶'}else if(state==='paused'){state='running';$('overlay').classList.add('hidden');$('controls').classList.remove('hidden');$('pause').textContent='Ⅱ'}}
function over(){state='over';if(Math.floor(distance)>best){best=Math.floor(distance);try{localStorage.setItem('dzikiGalopBest',best)}catch(e){}}$('eyebrow').textContent='KAŻDA PRZYGODA UCZY';panel('Koniec przejazdu',`Przebyta trasa: <b>${Math.floor(distance)} m</b> · Monety: <b>${coins}</b><br>Rekord: <b>${best} m</b>. Spróbuj pobić swój wynik!`,'Jeszcze jeden galop →');$('record').textContent='Spacja lub przycisk — nowy przejazd'}
$('start').onclick=()=>state==='paused'?pause():start();$('pause').onclick=pause;$('reset').onclick=start;
$('jump').onpointerdown=e=>{e.preventDefault();jump()};$('duck').onpointerdown=e=>{e.preventDefault();crouch()};
document.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','KeyP','KeyR'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp'){if(state==='ready'||state==='over')start();else jump()}if(e.code==='ArrowDown')crouch();if(e.code==='KeyP')pause();if(e.code==='KeyR')start()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause()});window.addEventListener('blur',()=>{if(state==='running')pause()});
function ellipse(x,y,rx,ry,c,rot=0){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);ctx.fill()}
function poly(points,c){ctx.fillStyle=c;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
function line(points,c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}
function tree(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);line([[0,0],[0,-90]],'#59674a',10);ellipse(-16,-96,40,43,'#71815a');ellipse(20,-116,43,48,'#819366');ellipse(0,-146,36,34,'#91a071');ctx.restore()}
function background(){let g=ctx.createLinearGradient(0,0,0,580);g.addColorStop(0,'#85b7ac');g.addColorStop(.6,'#e8dfb2');g.addColorStop(1,'#f1d397');ctx.fillStyle=g;ctx.fillRect(0,0,1024,733);ellipse(810,150,66,66,'#ffe6a3');ellipse(810,150,90,90,'#ffe3a220');
for(let i=0;i<6;i++){let x=((i*240-world*.045)%1440+1440)%1440-160;ellipse(x,120+i%3*34,60,10,'#f8efd266');}
poly([[0,356],[130,203],[236,311],[387,177],[565,354],[716,236],[890,332],[1024,230],[1024,510],[0,510]],'#93ab94');poly([[0,421],[190,302],[340,409],[512,286],[730,425],[915,319],[1024,380],[1024,530],[0,530]],'#658f7b');poly([[0,474],[180,407],[410,456],[590,383],[780,440],[1024,384],[1024,580],[0,580]],'#517e63');
for(let i=0;i<10;i++){let x=((i*151-world*.22)%1510+1510)%1510-100;tree(x,515,.48+(i%3)*.14)}
ctx.fillStyle='#8caa62';ctx.fillRect(0,519,1024,62);ctx.fillStyle='#dfb675';ctx.fillRect(0,573,1024,160);ctx.fillStyle='#f6cf8d';ctx.fillRect(0,576,1024,9);ctx.fillStyle='#b08850';ctx.fillRect(0,571,1024,5);
for(let i=0;i<24;i++){let x=((i*65-world*.8)%1260+1260)%1260-50;line([[x,621+i%3*30],[x+18,619+i%3*30]],'#c39a6044',3)}
for(let i=0;i<12;i++){let x=((i*104-world)%1248+1248)%1248-50;line([[x,567],[x-4,552],[x+3,559],[x+8,548]],'#658a4d',3)}
}
function horse(){const px=242,py=CFG.ground+y;ellipse(px,CFG.ground+7,85-Math.min(30,-y*.13),9,'#674f3d35');ctx.save();ctx.translate(px,py);let gallop=y<0?1:Math.sin(time*18);ctx.rotate(y<0?-.035:Math.sin(time*18)*.012);
line([[-60,-87],[-90,-96],[-108,-67]],'#392e2a',13);for(let i=0;i<4;i++){let a=(i<2?-46:44),b=gallop*(i%2?1:-1)*23;line([[a,-74],[a+b,-40],[a-b*.65,-7]],i%2?'#65412c':'#8e5130',11);line([[a-b*.65-4,-5],[a-b*.65+9,-5]],'#30352d',9)}
ellipse(-5,-91,70,34,'#a86438',-.05);ellipse(-26,-101,43,20,'#bf7c48');poly([[31,-97],[50,-159],[76,-151],[70,-102]],'#a86438');poly([[38,-112],[45,-159],[56,-169],[59,-140]],'#40342b');ellipse(72,-154,29,17,'#b97643',.3);ellipse(89,-142,15,12,'#c58b55',.15);poly([[54,-166],[52,-188],[63,-175]],'#98542f');poly([[68,-166],[74,-185],[78,-162]],'#b97643');ellipse(81,-157,3,3,'#1e302b');line([[93,-151],[89,-136],[58,-143]],'#394637',4);line([[87,-137],[26,-112],[-5,-131]],'#3a4534',2);
ctx.fillStyle='#24565a';ctx.fillRect(-29,-119,54,26);line([[-32,-119],[27,-119]],'#e7c17f',5);
ctx.save();ctx.translate(0,duck?35:0);let lean=duck?28:0;line([[2,-129],[14,-105],[6,-72]],'#243b43',13);line([[4,-73],[20,-73]],'#3c3430',9);line([[0,-131],[lean-9,-166]],'#d69a55',23);line([[lean-5,-158],[lean+18,-136],[32,-133]],'#dfa963',9);ellipse(lean-8,-187,13,16,'#efc698',-.1);ellipse(lean-8,-201,20,6,'#374c43');poly([[lean-22,-201],[lean-19,-215],[lean+2,-215],[lean+7,-201]],'#435c4e');line([[lean-15,-171],[lean-28,-162],[lean-38,-169]],'#b85e41',7);ctx.restore();ctx.restore()}
function obstacle(o){if(o.type==='coin'){ellipse(o.x,o.cy,14,17,'#b57d29');ellipse(o.x-2,o.cy-2,12,15,'#ffda76');line([[o.x-3,o.cy-9],[o.x-3,o.cy+6]],'#fff1b6',3);return}
if(o.type==='branch'){line([[o.x+28,573],[o.x+30,366],[o.x-53,366]],'#715138',16);line([[o.x+26,381],[o.x+60,344]],'#715138',10);ellipse(o.x+47,344,29,16,'#477755');ellipse(o.x-14,361,25,12,'#61884d');return}
if(o.type==='rock'){poly([[o.x-32,572],[o.x-29,544],[o.x-10,529],[o.x+17,537],[o.x+34,572]],'#687369');poly([[o.x-29,544],[o.x-10,529],[o.x+17,537],[o.x+2,555]],'#8a9381');return}
ctx.fillStyle='#825332';ctx.fillRect(o.x-34,530,68,43);ellipse(o.x+33,551,12,22,'#e6b67b');ellipse(o.x+33,551,7,15,'#b87c48');line([[o.x-30,540],[o.x+16,542]],'#b7844e',4);line([[o.x-24,557],[o.x+14,558]],'#5e412c',3)}
function update(dt){time+=dt;speed=Math.min(CFG.maxSpeed,CFG.baseSpeed+distance*.08);world+=speed*dt;distance+=speed*dt/17;duckTimer=Math.max(0,duckTimer-dt);if(!duckTimer)duck=false;vy+=CFG.gravity*dt;y+=vy*dt;if(y>=0){y=0;vy=0}
spawn-=dt;if(spawn<=0){const type=Math.random()<.28?'branch':Math.random()<.55?'log':'rock';objects.push({x:1100,type});for(let j=0;j<4;j++)objects.push({x:1100+j*48,cy:type==='branch'?490:390,type:'coin'});spawn=2.0+Math.random()*.6}
for(const o of objects){o.x-=speed*dt;if(o.type==='coin'){if(!o.hit&&Math.abs(o.x-255)<60&&Math.abs(o.cy-(CFG.ground+y-105))<86){o.hit=true;coins++;for(let i=0;i<6;i++)particles.push({x:o.x,y:o.cy,vx:(Math.random()-.5)*140,vy:-Math.random()*130,life:.5})}}else if(o.x>190&&o.x<310){if(o.type==='branch'){if(!duck||y<0){over();break}}else if(y>-55){over();break}}}
objects=objects.filter(o=>o.x>-100&&!o.hit);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);hud()}
function render(){ctx.clearRect(0,0,1024,733);background();objects.forEach(obstacle);horse();particles.forEach(p=>ellipse(p.x,p.y,3,3,'#ffe59a'));ctx.fillStyle='#fff4d980';ctx.font='11px system-ui';ctx.fillText('DZIKI GALOP  /  DOLINA ZACHODZĄCEGO SŁOŃCA',36,706)}
function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;if(state==='running')update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
